<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mathe-App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: manipulation; } 
        .step-hidden { display: none; }
        
        #chart-wrapper { 
            position: relative; 
            height: 350px; 
            width: 100%;
        }
        
        @media (min-width: 768px) {
            #chart-wrapper { height: 500px; } 
        }

        .axis-label {
            position: absolute;
            font-weight: bold;
            font-family: serif;
            font-style: italic;
            color: #1e293b;
            background-color: rgba(255,255,255,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20">
        <h1 class="text-xl font-bold text-center">Funktions-Plotter</h1>
    </div>

    <div class="max-w-4xl mx-auto p-4">
        
        <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-xs uppercase tracking-wide text-gray-500 font-bold mb-1">Funktion f(x)</label>
                    <input type="text" id="equation" value="x^2 - 2" 
                           class="w-full bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-lg focus:border-indigo-500 focus:bg-white outline-none transition" 
                           placeholder="z.B. x^2 - 2">
                </div>

                <div class="col-span-1">
                    <label class="block text-xs uppercase tracking-wide text-gray-500 font-bold mb-1">Intervall</label>
                    <div class="flex gap-2">
                        <input type="number" id="xMin" value="-3" inputmode="decimal"
                               class="w-1/2 bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-center focus:border-indigo-500 outline-none">
                        <input type="number" id="xMax" value="3" inputmode="decimal"
                               class="w-1/2 bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-center focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <div class="col-span-1">
                    <label class="block text-xs uppercase tracking-wide text-gray-500 font-bold mb-1">Schrittweite</label>
                    <input type="number" id="step" value="1" step="0.1" inputmode="decimal"
                           class="w-full bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-center focus:border-indigo-500 outline-none">
                </div>
            </div>

            <div class="mt-6">
                <button id="btnNext" onclick="handleNextStep()" 
                        class="w-full bg-indigo-600 active:bg-indigo-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg shadow-indigo-200 transform active:scale-95 transition-all flex justify-center items-center gap-2">
                    <span>Weiter</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="stepTable" class="step-hidden animate-fade-in-up mb-6">
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-100">
                <div class="bg-slate-100 p-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-bold text-slate-700">1. Wertetabelle</h2>
                </div>
                
                <div class="overflow-y-auto max-h-[300px]">
                    <table class="w-full text-center border-collapse">
                        <thead class="bg-indigo-50 text-indigo-900 sticky top-0 shadow-sm">
                            <tr>
                                <th class="p-3 w-1/2 border-r border-slate-200">x</th>
                                <th class="p-3 w-1/2">f(x)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-slate-600">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="stepPlot" class="step-hidden animate-fade-in-up">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-2">
                 <div class="bg-white p-2 mb-2 flex justify-between items-center">
                    <h2 class="font-bold text-slate-700">2. Graph</h2>
                </div>
                <div id="chart-wrapper">
                    <canvas id="myChart"></canvas>
                    <div class="axis-label" style="top: 0; left: 50%; transform: translateX(-50%);">y</div>
                    <div class="axis-label" style="bottom: 50%; right: 0; transform: translateY(50%);">x</div>
                </div>
                <p class="text-center text-xs text-slate-400 mt-2">Punkte wurden glatt verbunden.</p>
            </div>
        </div>
        
        <div class="h-20"></div>
    </div>

    <script>
        let currentStep = 0;
        let dataPoints = [];
        let chartInstance = null;

        function calculatePoints() {
            const exprString = document.getElementById('equation').value;
            const xMin = parseFloat(document.getElementById('xMin').value);
            const xMax = parseFloat(document.getElementById('xMax').value);
            const step = parseFloat(document.getElementById('step').value);
            
            dataPoints = [];
            
            try {
                const compiledExpr = math.compile(exprString);
                // Berechnungsschleife mit Rundung für saubere x-Werte
                for (let x = xMin; x <= xMax + (step/1000); x = Math.round((x + step) * 1000) / 1000) {
                    let y = compiledExpr.evaluate({x: x});
                    if (typeof y === 'number' && isFinite(y)) {
                        dataPoints.push({x: x, y: y});
                    } else {
                        dataPoints.push({x: x, y: null});
                    }
                }
            } catch (e) {
                alert("Bitte überprüfe die Funktionsgleichung!");
                console.error(e);
            }
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            body.innerHTML = ''; // Tabelle leeren

            dataPoints.forEach((p, index) => {
                const yDisplay = p.y !== null ? math.format(p.y, {precision: 3}) : 'n.d.';
                // Abwechselnde Hintergrundfarbe (Zebra-Look)
                const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                
                const row = `
                    <tr class="${rowClass} border-b border-slate-100 last:border-none">
                        <td class="p-3 font-medium border-r border-slate-100">${p.x}</td>
                        <td class="p-3 font-bold text-indigo-600">${yDisplay}</td>
                    </tr>
                `;
                body.innerHTML += row;
            });

            document.getElementById('stepTable').classList.remove('step-hidden');
            // Scrollt sanft zur Tabelle
            document.getElementById('stepTable').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderPlot() {
            document.getElementById('stepPlot').classList.remove('step-hidden');
            const ctx = document.getElementById('myChart').getContext('2d');
            const validData = dataPoints.filter(p => p.y !== null);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'f(x)',
                        data: validData,
                        showLine: true,
                        fill: false,
                        borderColor: '#4f46e5',
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4, 
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#4f46e5',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: 10 },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'center',
                            grid: {
                                color: (c) => c.tick.value === 0 ? '#1e293b' : '#f1f5f9',
                                lineWidth: (c) => c.tick.value === 0 ? 3 : 1,
                                tickLength: 5
                            },
                            ticks: { color: '#64748b', font: { size: 10 } }
                        },
                        y: {
                            type: 'linear',
                            position: 'center',
                            grid: {
                                color: (c) => c.tick.value === 0 ? '#1e293b' : '#f1f5f9',
                                lineWidth: (c) => c.tick.value === 0 ? 3 : 1
                            },
                            ticks: { color: '#64748b', font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `(${context.parsed.x} | ${context.parsed.y.toFixed(3)})`
                            },
                            backgroundColor: 'rgba(30, 41, 59, 0.9)',
                            padding: 10
                        }
                    }
                }
            });
            
            document.getElementById('stepPlot').scrollIntoView({ behavior: 'smooth' });
        }

        function handleNextStep() {
            const btn = document.getElementById('btnNext');
            const btnText = btn.querySelector('span');

            if (currentStep === 0) {
                calculatePoints();
                renderTable();
                currentStep = 1;
            } else if (currentStep === 1) {
                renderPlot();
                btnText.innerText = "Neu starten";
                btn.querySelector('svg').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />';
                btn.classList.replace('bg-indigo-600', 'bg-slate-700');
                currentStep = 2;
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
