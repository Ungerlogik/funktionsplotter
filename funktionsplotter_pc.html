<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathe-Tool: Smooth Kurven mit Achsen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step-hidden { display: none; }
        #chart-wrapper { position: relative; height: 500px; }
        /* Label-Stil für die Achsenbeschriftung */
        .axis-label {
            position: absolute;
            font-weight: bold;
            font-style: italic;
            color: #1e293b;
            font-family: serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <h1 class="text-3xl font-extrabold mb-8 text-indigo-700 border-b pb-4">Funktions-Visualisierer</h1>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 bg-indigo-50 p-4 rounded-lg">
            <div>
                <label class="block text-sm font-bold text-indigo-900 mb-1">Funktion f(x)</label>
                <input type="text" id="equation" value="1/x" class="w-full border-2 border-indigo-200 rounded-lg p-2 outline-none focus:border-indigo-500" placeholder="z.B. x^2">
            </div>
            <div>
                <label class="block text-sm font-bold text-indigo-900 mb-1">Bereich (x)</label>
                <div class="flex items-center gap-2">
                    <input type="number" id="xMin" value="-3" class="w-full border-2 border-indigo-200 rounded-lg p-2">
                    <span>bis</span>
                    <input type="number" id="xMax" value="3" class="w-full border-2 border-indigo-200 rounded-lg p-2">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-indigo-900 mb-1">Schrittweite</label>
                <input type="number" id="step" value="1" step="0.1" class="w-full border-2 border-indigo-200 rounded-lg p-2">
            </div>
            <div class="flex items-end">
                <button id="btnNext" onclick="handleNextStep()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 shadow-md transition-all">
                    Weiter →
                </button>
            </div>
        </div>

        <div id="stepTable" class="step-hidden mb-10">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <span class="bg-indigo-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                Wertetabelle
            </h2>
            <div class="overflow-x-auto border rounded-xl shadow-sm">
                <table class="w-full text-left border-collapse bg-white">
                    <thead class="bg-indigo-600 text-white text-center">
                        <tr id="tableHead"></tr>
                    </thead>
                    <tbody class="text-center">
                        <tr id="tableBody"></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="stepPlot" class="step-hidden">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <span class="bg-indigo-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span>
                Graph
            </h2>
            <div id="chart-wrapper" class="bg-white border-2 border-slate-200 rounded-xl p-6 shadow-inner relative">
                <canvas id="myChart"></canvas>
                <div class="axis-label" style="top: 10px; left: 51%;">y</div>
                <div class="axis-label" style="bottom: 15px; right: 20px;">x</div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let dataPoints = [];
        let chartInstance = null;

        function calculatePoints() {
            const exprString = document.getElementById('equation').value;
            const xMin = parseFloat(document.getElementById('xMin').value);
            const xMax = parseFloat(document.getElementById('xMax').value);
            const step = parseFloat(document.getElementById('step').value);
            
            dataPoints = [];
            const compiledExpr = math.compile(exprString);

            for (let x = xMin; x <= xMax; x = Math.round((x + step) * 100) / 100) {
                try {
                    let y = compiledExpr.evaluate({x: x});
                    if (typeof y === 'number' && isFinite(y)) {
                        dataPoints.push({x: x, y: y});
                    } else {
                        dataPoints.push({x: x, y: null});
                    }
                } catch (e) { console.error(e); }
            }
        }

        function renderTable() {
            const head = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            head.innerHTML = '<th class="p-3 border">x</th>';
            body.innerHTML = '<td class="p-3 border font-bold text-indigo-600">f(x)</td>';

            dataPoints.forEach(p => {
                head.innerHTML += `<th class="p-3 border font-normal">${p.x}</th>`;
                body.innerHTML += `<td class="p-3 border">${p.y !== null ? math.format(p.y, {precision: 3}) : 'n.d.'}</td>`;
            });
            document.getElementById('stepTable').classList.remove('step-hidden');
        }

        function renderPlot() {
            document.getElementById('stepPlot').classList.remove('step-hidden');
            const ctx = document.getElementById('myChart').getContext('2d');
            const validData = dataPoints.filter(p => p.y !== null);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Funktionsgraph',
                        data: validData,
                        showLine: true,
                        fill: false,
                        borderColor: '#4f46e5',
                        tension: 0.4, // Glättung
                        borderWidth: 3,
                        pointRadius: 5,
                        pointBackgroundColor: '#4f46e5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'center', // Achse mittig (bei y=0)
                            grid: {
                                color: (context) => context.tick.value === 0 ? '#1e293b' : '#e2e8f0',
                                lineWidth: (context) => context.tick.value === 0 ? 3 : 1 // X-Achse dicker
                            },
                            ticks: { color: '#64748b' }
                        },
                        y: {
                            type: 'linear',
                            position: 'center', // Achse mittig (bei x=0)
                            grid: {
                                color: (context) => context.tick.value === 0 ? '#1e293b' : '#e2e8f0',
                                lineWidth: (context) => context.tick.value === 0 ? 3 : 1 // Y-Achse dicker
                            },
                            ticks: { color: '#64748b' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function handleNextStep() {
            if (currentStep === 0) {
                calculatePoints();
                renderTable();
                currentStep = 1;
            } else if (currentStep === 1) {
                renderPlot();
                document.getElementById('btnNext').innerText = "Neu starten";
                currentStep = 2;
            } else {
                location.reload();
            }
        }
    </script>
</body>

</html>
